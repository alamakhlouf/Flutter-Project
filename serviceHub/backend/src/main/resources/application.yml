spring:
  application:
    name: servicehub-api
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:servicehub_api}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:servicehub-default-dev-signing-key-at-least-32-bytes-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  google:

    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}
  firebase:
    credentials-file: ${FIREBASE_CREDENTIALS:classpath:firebase-service-account.json}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
