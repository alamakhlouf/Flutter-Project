spring:
  datasource:
    url: jdbc:h2:mem:servicehub;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
app:
  seed:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:servicehub-default-dev-signing-key-at-least-32-bytes-long}
  google:
    client-id: ${GOOGLE_CLIENT_ID:721746615689-31o7qo4p1rsu2s6ku9ako4galdjs064p.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET: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}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}
  firebase:
    credentials-file: ${FIREBASE_CREDENTIALS:classpath:firebase-service-account.json}
